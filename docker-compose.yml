#Any information included in this file such as passwords or usernames is a dev-only placeholder

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paylink
      POSTGRES_USER: paylink
      POSTGRES_PASSWORD: paylink
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paylink -d paylink"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/paylink
      DB_USER: paylink
      DB_PASSWORD: paylink
    ports: ["8080:8080"]

volumes:
  pgdata: